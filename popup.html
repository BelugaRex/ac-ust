<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style media="not all">
  /*
   * ===== Apple-inspired Design System =====
   * 参考资料: APPLE-DESIGN.md
   *
   * 字体策略 (跨平台逐字形回退):
   *  - macOS/iOS: -apple-system / SF Pro 直接生效，中文自动随系统走苹方
   *  - Windows: Segoe UI Variable (Win11) → Segoe UI (Win10) 显示拉丁与数字；
   *    中文显式回退 Microsoft YaHei UI → Microsoft YaHei，不吃浏览器默认兑底
   *  - Linux: system-ui → Noto Sans CJK SC / 文泉驿等默认无衬线
   *  - 开源替代: 用户机器已装 Inter 时自动优先 (与 SF Pro 最接近)
   *  - 关键纪律：input/button 等表单控件默认不继承 body 字体，
   *    必须显式 font-family: inherit，否则数字字形与正文不统一
   *
  * 正文、状态和表单优先保证在紧凑弹窗中的清晰层级与可读性
   */

  /* ===== Design Tokens ===== */
  :root {
    color-scheme: light dark;
    /* 颜色: 单一 Action Blue + 表面色 + 墨色文本 */
    --c-accent: #0071e3;           /* Apple Web Hero CTA 蓝：比旧 #0066cc 更暖亮，少“医院蓝”冷感 */
    --c-accent-hover: #2997ff;     /* Focus 环亮一阶（Apple Web Hero hover 色，浅底上浮现清晰可见） */
    --c-accent-on-dark: #2997ff;   /* 深色面用蓝 (此处基本不用) */
    --c-accent-ring: rgba(0, 113, 227, 0.16);
    --c-accent-soft: rgba(0, 113, 227, 0.08);

    --c-canvas: #ffffff;           /* 主画布白 */
    --c-parchment: #f5f5f7;        /* Apple 标志性暖白 (页面背景) */
    --c-pearl: #f4f4f5;            /* 次级 input 底：中性浅灰，避开紫白 nudge，与 canvas 白形成可辨内凹层级 */

    --c-ink: #1d1d1f;              /* 标题/正文近黑墨 */
    --c-ink-80: #333333;           /* 次级文本 */
    --c-muted: #5f5f5f;            /* 远端灰 (浅色默认加深至 parchment ~5.8:1、白底 ~6.4:1。达 WCAG AA 4.5:1) */
    --c-muted-2: #6e6e73;          /* 中性灰 (默认加深至 ~4.7:1；高对比度档进一步压至 #4d4d4d) */

    --c-hairline: #e0e0e0;         /* 1px 发丝边框 */
    --c-divider: #f0f0f0;          /* 软分隔线 */
    --c-chip: #d2d2d7;             /* 半透明圆形控件基色 */

    --c-success: #248a3d;
    --c-success-bg: #f5fbf6;
    --c-warning: #b25a00;
    --c-warning-bg: #fff8ef;
    --c-warning-border: rgba(178, 90, 0, 0.18);
    --c-danger: #d70015;

    /* 圆角: 收紧的桌面尺度 (避免混用多种中等半径) */
    --r-none: 0px;
    --r-xs: 5px;
    --r-sm: 8px;
    --r-md: 9px;
    --r-lg: 10px;     /* 卡片 */
    --r-pill: 9999px; /* 仅保留给 toggle、状态徽标、圆点这些天生胶囊形的元素 */

    /* 间距: Apple 的 8px 基准节奏 */
    --s-xxs: 4px;
    --s-xs: 8px;
    --s-sm: 12px;
    --s-md: 17px;
    --s-lg: 24px;
    --s-xl: 32px;

    /* 字体族: 逐字形回退 —— 拉丁/数字优先几何无衬线，CJK 显式声明 UI 调优变体 */
    --font-display: "Inter Variable", "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", system-ui, "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;
    --font-text: "Inter Variable", "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

    /* 唯一允许的投影 (本扩展内仅状态圆点等极少数情况使用)
       注意: Apple 系统对 UI chrome 不用阴影,仅用于"产品照片"。
       这里 popup 无产品图,默认全部无阴影保持平面观感。 */
    --shadow: none;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    /* 由内容决定 popup 宽度；不使用 vw/vh，避免初始布局竞态导致窗口塌陷 */
    width: max-content;
    min-width: 0;
    font-family: var(--font-text);
    background: var(--c-parchment);
    color: var(--c-ink);
    font-size: 16px; /* 主字号与 16px 头栏 icon 同尺寸 */
    line-height: 1.5;
    letter-spacing: 0;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .app-shell {
    width: max-content;
    /* 设计宽度下限：zh 4 字标签内容仅 ~228px 会过窄；
       300px 接近主流扩展 popup 尺度（Dark Reader ~300、uBlock ~270）。
       min-width 同时钳制 max-content 贡献，body 与静态预览缩放都跟随此下限；
       更宽的 locale 仍能自然撑开，不用 vw 避免窗口塌陷回归。 */
    min-width: 300px;
  }

  /* 普通 HTTP 预览保持插件原始排版，由脚本在窄窗口中整体等比缩放。 */
  .static-preview body {
    width: auto;
    min-width: 0;
    overflow-x: clip;
  }
  .static-preview .app-shell {
    transform-origin: top left;
  }

  /* ===== Header Bar (实色羊皮卷，无毛玻璃/backdrop 模糊) ===== */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
    padding: 8px 16px 7px;
    background: var(--c-parchment);
    border-bottom: 1px solid rgba(0, 0, 0, 0.06);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .header-brand {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .header-brand img {
    width: 16px;
    height: 16px;
    /* 锁定 16px 像素艺术母版，HiDPI 屏缩放保留像素锐边而非平滑模糊 */
    image-rendering: pixelated;
  }
  .header-name {
    /* 字标与 16px 品牌 icon 同尺寸,保持头栏视觉对齐 */
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 600;
    line-height: 1.19;
    letter-spacing: 0;
    color: var(--c-ink);
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .header-help {
    /* 扁平图标按钮（macOS 工具栏语义）：默认无底色，hover 才显露实心填充；
       不用液态玻璃/半透明模糊质感 */
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: transparent;
    color: var(--c-muted);
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    line-height: 1;
    transition: transform 0.16s ease, background 0.16s ease, color 0.16s ease;
  }
  .header-help:hover {
    background: #e8e8ed;
    color: var(--c-ink);
  }
  .header-help:active { transform: scale(0.95); } /* Apple 系统级按压微交互 */
  .header-version {
    /* 版本信息为最低优先级元数据：11px 略高于 HIG 11pt 最小字号地板，去斜体强调体在不拉开与其它文本差异的前提下避免与正文混合。 */
    font-size: 11px;
    font-style: normal;
    line-height: 16px;
    color: var(--c-muted);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0;
    white-space: nowrap;
    text-align: right;
  }

  .content {
    width: max-content;
    /* header（含版本时间戳）比表单宽时，卡片撑满 shell 宽度，
       保证卡片右缘与 header 右缘对齐；表单更宽时仍由内容决定自然宽 */
    min-width: 100%;
    padding: var(--s-xs);
  } /* 固定 8px 外侧 gutter，内容宽度由内部组件决定 */

  /* ===== Status Hero Card (参考 product-tile-light) ===== */
  .status-card {
    background: var(--c-canvas);
    border-radius: var(--r-lg);
    /* 左右 1px 可见边框 + 15px padding = 16px 视觉内缩；上下收紧 */
    padding: 12px 15px;
    margin-bottom: var(--s-xs);
    border: 1px solid var(--c-hairline);
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .status-card:has(.ac-dot.on) {
    /* 运行中整卡浸入 success 绿调：状态区与下方白色设置卡形成强对比（Grammarly/AdBlock 式彩色状态区） */
    background: var(--c-success-bg);
    border-color: rgba(36, 138, 61, 0.32);
  }
  .status-card:has(.ac-dot.unknown) {
    border-color: var(--c-hairline);
  }

  .ac-indicator {
    /* body-strong token: 16px/600/1.24/0 */
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 16px;
    font-weight: 600;
    line-height: 1.24;
    letter-spacing: 0;
    margin-bottom: 4px;
    color: var(--c-ink);
  }
  .ac-dot {
    width: 9px; height: 9px;
    border: 2px solid transparent;
    border-radius: var(--r-pill);
    display: inline-block;
    flex-shrink: 0;
  }
  /* 状态信号走 success 绿；accent 蓝保留给纯交互（toggle/链接/focus/按钮），避免“蓝=既可点又=运行中”歧义 */
  .ac-dot.on { background: var(--c-success); }
  .ac-dot.off {
    background: transparent;
    border-color: var(--c-muted-2);
    border-radius: var(--r-xs);
  }
  .ac-dot.unknown {
    background: transparent;
    border-color: var(--c-chip);
  }

  /* Hero 倒计时：Forest/uBlock Origin 式视觉锚点 —— 大号等宽数字是弹窗第一焦点。
     字号上限对本元素单独放宽至 32px（popup 其余文本仍 ≤16px）。
     构图：caption 靠左、大数字靠右底部对齐，数字右缘与下方表单控件同列，
     避免左列堆积、右侧空白的失衡排版。 */
  .hero-countdown {
    align-items: flex-end;
    justify-content: space-between;
    gap: var(--s-xs);
    margin-top: var(--s-xs);
  }
  .hero-number {
    font-family: var(--font-display);
    font-size: 32px;
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -0.02em;
    color: var(--c-ink);
    font-variant-numeric: tabular-nums;
  }
  .hero-caption {
    font-size: 12px;
    line-height: 16px;
    color: var(--c-muted);
    letter-spacing: 0;
  }
  .hero-idle {
    margin-top: var(--s-xs);
    font-size: 12px;
    line-height: 16px;
    color: var(--c-muted);
    letter-spacing: 0;
  }

  .safetynet-warning {
    margin-top: var(--s-xs);
    padding: 7px 15px;
    background: var(--c-warning-bg);
    border: 1px solid var(--c-warning-border);
    border-radius: var(--r-md);
    color: var(--c-warning);
    font-size: 16px;
    font-weight: 500;
    line-height: 1.5;
    letter-spacing: 0;
    text-align: left;
  }

  /* ===== Settings Card：统一 form-row 表单（label 左 / 控件右） =====
     依据 Apple HIG Layout：
     - 「Align components with one another to make them easier to scan」
       所有行同一结构，所有控件右缘对齐在同一列；
     - 「Indentation…helps people understand an information hierarchy」
       子行 16px 缩进表达从属关系，不再靠列轨道错位对齐。 */
  .settings-card {
    background: var(--c-canvas);
    border-radius: var(--r-lg);
    margin-bottom: var(--s-xs);
    border: 1px solid var(--c-hairline);
    overflow: hidden;
  }
  .settings-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
    /* 上下 1px 边框/分隔线补偿后视觉 12px */
    padding: 11px 15px;
    background: var(--c-canvas);
    border-bottom: 1px solid var(--c-divider);
  }
  .settings-header h3 {
    /* 卡头与 16px 基准同号 */
    font-family: var(--font-display);
    font-size: 16px;
    color: var(--c-ink);
    letter-spacing: 0;
    font-weight: 600;
    line-height: 1.29;
    text-transform: none;
    margin: 0;
  }
  .toggle-area {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
  }
  .toggle-state {
    /* 开关状态属于元数据：12px muted 降级，不与 16px 标题抢层级 */
    font-size: 12px;
    font-weight: 500;
    line-height: 16px;
    color: var(--c-muted);
    white-space: nowrap;
    letter-spacing: 0;
  }

  /* Toggle Switch — Apple pill toggle 风格 */
  .toggle-switch {
    position: relative;
    display: inline-block;
    width: 36px;
    height: 20px;
    flex-shrink: 0;
  }
  .toggle-switch::after {
    content: "";
    position: absolute;
    inset: -12px -4px;
    cursor: pointer;
  }
  .toggle-switch input {
    position: absolute;
    inset: 0;
    opacity: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    font-size: 16px;
    cursor: pointer;
  }
  .toggle-slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background-color: var(--c-chip);
    transition: background-color 0.2s ease;
    border-radius: var(--r-pill);
  }
  .toggle-slider:before {
    position: absolute;
    content: "";
    height: 16px; width: 16px;
    left: 2px; bottom: 2px;
    background-color: white;
    transition: transform 0.2s ease;
    border-radius: var(--r-pill);
    /* 圆形 knob 上保留必要阴影以保留可见度 (Apple 自家 toggle
       在系统层级也有此阴影;UI chrome 模式仍保持平面观感) */
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.18);
  }
  .toggle-switch input:checked + .toggle-slider {
    background-color: var(--c-accent);
  }
  .toggle-switch input:checked + .toggle-slider:before {
    transform: translateX(16px);
  }
  .toggle-switch input:disabled + .toggle-slider {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .toggle-switch input:focus-visible + .toggle-slider {
    outline: 2px solid var(--c-accent-hover);
    outline-offset: 2px;
  }
  .toggle-switch:has(input:checked) {
    transform-origin: right center;
  }
  .toggle-switch input:checked + .toggle-slider:active {
    /* 按下时与 Action Blue 同键触发的 微交互缩放 */
    transform: scale(0.96);
  }

  /* 主/从 toggle 区分：settings-header 主 toggle 36×20，运行时段行子 toggle 按 HIG macOS 子控件尺度递减为 32×18，命中区继续由 ::after 维持 ≥44px */
  #activeHoursRow .toggle-switch {
    width: 32px;
    height: 18px;
  }
  #activeHoursRow .toggle-slider:before {
    height: 14px;
    width: 14px;
  }
  #activeHoursRow .toggle-switch input:checked + .toggle-slider:before {
    transform: translateX(14px);
  }

  /* 表单区段：区段间 1px 分隔线，段内行距 8px */
  .form-section {
    display: flex;
    flex-direction: column;
    gap: var(--s-xs);
    /* 左右 1px 边框补偿后视觉 16px */
    padding: 8px 15px;
  }
  .form-section + .form-section {
    border-top: 1px solid var(--c-divider);
  }
  .form-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--s-xs);
    min-height: 32px;
  }
  .form-row.sub {
    /* HIG 缩进：子行从属于上方主行（运行时段 → 开始/结束时间） */
    padding-left: 16px;
  }
  .row-label {
    font-size: 16px;
    font-weight: 400;
    line-height: 1.43;
    letter-spacing: 0;
    color: var(--c-ink-80);
    white-space: nowrap;
    cursor: pointer;
  }
  .form-row.sub:has(input:disabled) .row-label {
    /* 父开关关闭时子行标签与输入框一并降级 */
    color: var(--c-muted-2);
  }

  /* 所有输入控件统一 5rem×32px/16px，右缘与 toggle 同列对齐 */
  .form-row input[type="time"],
  .form-row input[type="number"] {
    border: 1px solid var(--c-hairline);
    border-radius: var(--r-sm);
    padding: 0 7px;
    margin: 0;
    /* 控件默认 UA 字体不继承 body：显式继承设计字体栈，数字字形与全 popup 统一 */
    font-family: inherit;
    font-size: 16px;
    line-height: 1.2;
    letter-spacing: 0;
    background: var(--c-pearl);
    color: var(--c-ink);
    font-variant-numeric: tabular-nums;
    width: 5rem;
    min-width: 5rem;
    height: 32px;
    min-height: 32px;
    flex-shrink: 0;
    transition: border-color 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
  }
  .form-row input[type="number"] {
    -moz-appearance: textfield;
    appearance: textfield;
  }
  .form-row input[type="time"]::-webkit-calendar-picker-indicator {
    width: 16px;
    height: 16px;
    padding: 0;
    margin: 0;
  }
  .form-row input:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .form-row input[type="time"]:not(:disabled):hover:not(:focus),
  .form-row input[type="number"]:not(:disabled):hover:not(:focus) {
    border-color: #c7c7cc;
  }
  .form-row input[type="time"]:not(:disabled):focus,
  .form-row input[type="number"]:not(:disabled):focus {
    border-color: var(--c-accent);
    box-shadow: 0 0 0 3px var(--c-accent-ring);
    outline: none;
    background: var(--c-canvas);
  }
  /* 隐藏 number 输入框的 spinner 以保持 Apple 极简观感 */
  .form-row input[type="number"]::-webkit-inner-spin-button,
  .form-row input[type="number"]::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  /* 数字输入框内嵌单位：值靠左、单位 12px muted 靠右，
     标签不再需要「（分钟）」括注，框内空间被有意义内容填充 */
  .number-field {
    position: relative;
    display: inline-flex;
    flex-shrink: 0;
    width: 5rem;
  }
  .number-field input[type="number"] {
    width: 100%;
    min-width: 0;
  }
  .field-unit {
    position: absolute;
    right: 7px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 12px;
    line-height: 1;
    color: var(--c-muted);
    pointer-events: none;
  }

  .settings-hint {
    /* 固定标签页提醒：caption 级 12px/500 muted，作为卡内最末区段。
       width:0 + min-width:100% 抵消长文本的 max-content 贡献，
       防止整句不换行把 popup 自然宽度撑宽（旧 hint-pin 同款防护）。 */
    border-top: 1px solid var(--c-divider);
    padding: 8px 15px;
    color: var(--c-muted);
    font-size: 12px;
    font-weight: 500;
    line-height: 16px;
    letter-spacing: 0;
    width: 0;
    min-width: 100%;
    overflow-wrap: anywhere;
  }

  /* ===== Footer (Apple footer: 紧致法定信息 + 单行链) ===== */
  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
    padding-top: var(--s-xs);
  }
  .status {
    /* 瞬时反馈消息属于元数据：12px muted，不与正文抢层级 */
    font-size: 12px;
    color: var(--c-muted);
    flex: 1;
    line-height: 16px;
    letter-spacing: 0;
  }
  /* HIG：绿色语义留给成功状态；accent 蓝保留给交互（toggle/链接/焦点/按钮），避免“蓝=既可点又=成功”歧义 */
  .status.success { color: var(--c-success); }
  .status.error { color: var(--c-danger); }

  .btn-diagnose {
    /* button-secondary-pill token: 透明底 + Action Blue 描边 + pill */

        <span class="hero-number" id="countdownNumber">--</span>
        <span class="hero-caption" id="countdownText">--</span>
      </div>
      <div class="hero-idle" id="idleDisplay" style="display:none">
        <span data-i18n="acIdle"></span>
      </div>
      <div class="safetynet-warning" id="safetynetWarning" role="status" aria-live="polite" aria-atomic="true" style="display:none"></div>
    </div>
    <p class="visually-hidden" id="statusAnnouncement" role="status" aria-live="polite" aria-atomic="true"></p>

    <!-- Settings card: global active-hours scope + mutually exclusive automation modes -->
    <div class="settings-card">
      <div class="automation-heading">
        <div class="automation-title-row">
          <h2 id="automationSettingsLabel">
            <label for="automationToggle" data-i18n="automationSettingsLabel"></label>
          </h2>
          <label class="toggle-switch">
            <input type="checkbox" id="automationToggle" aria-labelledby="automationSettingsLabel">
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>
      <section class="active-hours-section" aria-labelledby="activeHoursRow" aria-describedby="automationScopeHint">
      <div class="settings-header" id="activeHoursSectionHeader">
        <h3 id="activeHoursRow">
          <label for="activeHoursToggle" data-i18n="activeHoursLabel"></label>
        </h3>
        <div class="toggle-area">
          <label class="toggle-switch">
            <input type="checkbox" id="activeHoursToggle" aria-labelledby="activeHoursRow" aria-describedby="automationScopeHint">
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>
      <p class="active-hours-hint" id="automationScopeHint" data-i18n="automationScopeHint"></p>
      <div class="setting-group" id="activeHoursBody" role="group" aria-labelledby="activeHoursRow">
        <span class="visually-hidden" id="time24Hint" data-i18n="time24Hint"></span>
        <div class="field-grid" id="activeHoursSection">
          <div class="field">
            <label class="field-label" for="activeHoursStart" data-i18n="activeHoursStartShort"></label>
            <input type="text" inputmode="numeric" placeholder="HH:mm" pattern="(?:[01]\d|2[0-3]):[0-5]\d" maxlength="5" autocomplete="off" spellcheck="false" id="activeHoursStart" value="08:00" data-i18n-aria-label="activeHoursStartLabel" aria-describedby="time24Hint">
          </div>
          <div class="field">
            <label class="field-label" for="activeHoursEnd" data-i18n="activeHoursEndShort"></label>
            <input type="text" inputmode="numeric" placeholder="HH:mm" pattern="(?:[01]\d|2[0-3]):[0-5]\d" maxlength="5" autocomplete="off" spellcheck="false" id="activeHoursEnd" value="23:00" data-i18n-aria-label="activeHoursEndLabel" aria-describedby="time24Hint">
          </div>
        </div>
      </div>
      </section>
      <fieldset class="mode-section">
        <legend class="visually-hidden" id="automationModeLabel" data-i18n="automationModeLabel"></legend>
        <span class="visually-hidden" id="timerToggleState" data-i18n="timerDisabled" aria-live="polite" aria-atomic="true"></span>
        <span class="visually-hidden" id="smartModeToggleState" data-i18n="timerDisabled" aria-live="polite" aria-atomic="true"></span>
        <div class="mode-segment">
          <button type="button" class="mode-choice" id="timerToggle" aria-pressed="false" aria-describedby="timerToggleState">
            <span id="pwmSettingsTitle" data-i18n="pwmSettings"></span>
          </button>
          <button type="button" class="mode-choice" id="smartModeToggle" aria-pressed="false" aria-describedby="smartModeToggleState">
            <span id="smartModeTitle" data-i18n="smartModeLabel"></span>
          </button>
        </div>
      <div class="mode-detail" id="timerBody" role="group" aria-labelledby="pwmSettingsTitle">
        <div id="intervalInputs">
          <div class="field-grid">
            <div class="field">
              <label class="field-label" for="onMinutes" data-i18n="onMinutesLabel"></label>
              <span class="number-field">
                <input type="number" id="onMinutes" value="30" min="1" step="1">
                <span class="field-unit" data-i18n="unitMinutes"></span>
              </span>
            </div>
            <div class="field">
              <label class="field-label" for="offMinutes" data-i18n="offMinutesLabel"></label>
              <span class="number-field">
                <input type="number" id="offMinutes" value="30" min="1" step="1">
                <span class="field-unit" data-i18n="unitMinutes"></span>
              </span>
            </div>
          </div>
        </div>
      </div>
      <div class="mode-detail smart-body" id="smartBody" role="group" aria-labelledby="smartModeTitle">
          <div class="smart-slider-row">
            <span class="smart-end" data-i18n="smartModeWeak"></span>
            <div class="smart-slider-wrap">
              <input type="range" id="smartSensitivity" min="0" max="10" step="1" value="5" data-i18n-aria-label="smartModeSensitivityLabel">
              <span class="smart-slider-value" id="smartSensitivityValue" aria-hidden="true">5</span>
            </div>
            <span class="smart-end" data-i18n="smartModeStrong"></span>
          </div>
          <div class="smart-readout" id="smartReadout">
            <div class="smart-readout-row">
              <span class="smart-readout-label" data-i18n="smartModeSuggested"></span>
              <span class="smart-readout-value" id="smartSuggested">--</span>
            </div>
            <div class="smart-readout-row">
              <span class="smart-readout-label" data-i18n="smartModeTeq"></span>
              <span class="smart-readout-value" id="smartTeq">--</span>
            </div>
            <div class="smart-readout-row">
              <span class="smart-readout-label" data-i18n="smartModeUpdated"></span>
              <span class="smart-readout-value" id="smartUpdated">--</span>
            </div>
          </div>
      </div>
      </fieldset>
      <div class="settings-hint" id="scheduleHintPin" data-i18n="scheduleHintPinTab"></div>
    </div>

    <!-- Footer: status message + diagnose button + results -->
    <div class="footer">
      <div class="status" id="status" role="status" aria-live="polite" aria-atomic="true"></div>
      <button class="btn-diagnose" id="btnDiagnose" data-i18n="btnDiagnose"></button>
    </div>
    <div class="diagnose-result" id="diagnoseResult" role="region" tabindex="0" aria-live="off" data-i18n-aria-label="diagnoseResultLabel">
      <div class="diag-bar">
        <span class="diag-bar-title" data-i18n="diagnoseResultLabel"></span>
        <button class="diag-copy" id="btnCopyDiag" data-i18n="btnCopyDiag" hidden></button>
      </div>
      <div class="diag-content" id="diagContent"></div>
    </div>

  </div>

</div>

<script src="i18n.js"></script>
<script src="billing-helpers.js"></script>
<script src="smart-mode.js"></script>
<script src="popup-diagnostic-fallback.js"></script>
<script src="popup.js?v=0.8.8"></script>
</body>
</html>
