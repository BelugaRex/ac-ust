name: 功能建议
description: 提议新功能或改进现有使用体验
title: "[Feature] "
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议。请先描述使用场景和要解决的问题，再说明期望的功能。

  - type: textarea
    id: motivation
    attributes:
      label: 使用场景与问题
      description: 你在什么情况下需要这个功能？目前遇到了什么限制？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 功能建议
      description: 请清楚、简洁地描述希望新增或改进的功能。
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: 期望行为
      description: 请说明理想情况下的操作流程和结果。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 如果尝试过其他方式，请说明其不足。

  - type: dropdown
    id: contribution
    attributes:
      label: 是否愿意贡献代码
      options:
        - 愿意提交 Pull Request
        - 可以协助测试
        - 暂时只能提供建议
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: 补充信息
      description: 可添加界面草图、参考链接或其他背景信息。

  - type: checkboxes
    id: duplicate-check
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，确认没有相同或高度相似的建议。
          required: true