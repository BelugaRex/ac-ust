name: CI

on:
  pull_request:
    branches: [main, beta-rex]
  push:
    branches: [main, beta-rex]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Build extension package (Linux)
        shell: bash
        run: bash ./build.sh
      - name: Run unit tests
        run: node test/verify-fix.mjs
